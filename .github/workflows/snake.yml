name: Snake de contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0b6db3&color_dots=#ebedf0,#cfe4f6,#7cc0f0,#2a9be2,#0b6db3
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2a9be2&color_dots=#161b22,#0e3355,#16639e,#2a9be2,#a9d8f8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
